<style>
:root{
  --az:#0D18A8; --ac:#227EF6; --ok:#166534; --bad:#991b1b; --bg:#f8fafc; --lt:#dbeafe;
  --tx:#0f172a; --mut:#64748b; --bd:#e2e8f0; --az-soft:#aab1ea;
  --font:'Poppins','Segoe UI',-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-weight:300;font-size:14px;color:var(--tx);background:var(--bg);line-height:1.5}
b,strong,h1,h2,h3,h4,th{font-weight:600}
button,input,select,textarea{font-family:inherit;font-size:13px}

/* Encabezado */
.top{background:var(--az);color:#fff}
.top-in{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;min-height:54px;padding-right:20px;border-right:1px solid rgba(255,255,255,.35)}
.logo img{height:54px;width:auto;display:block}
.logo .wm{font-weight:700;font-size:26px;letter-spacing:.32em;color:#fff;padding-left:.32em}
.top h1{margin:0;font-size:18px;font-weight:700;flex:1;min-width:220px}
.top h1 small{display:block;font-weight:300;font-size:12px;opacity:.85}
nav{background:#fff;border-bottom:1px solid var(--bd)}
nav .in{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav button.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;cursor:pointer;color:var(--mut);font-weight:500}
nav button.tab.on{color:var(--az);border-bottom-color:var(--az);font-weight:600}
nav .sp{flex:1}

main{max-width:1280px;margin:0 auto;padding:20px}

/* Botones */
.btn{border:1px solid var(--az);background:#fff;color:var(--az);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--lt)}
.btn.pri{background:var(--az);color:#fff}
.btn.pri:hover{background:#0a1385}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.bad:hover{background:#fee2e2}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Tarjetas KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px 14px;text-align:left;font-family:inherit;color:inherit}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--ac)}
.kpi.sel{outline:2px solid var(--az)}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .v{font-size:28px;font-weight:700;line-height:1.2}
.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.az .v{color:var(--az)}

/* Barras de herramientas / filtros */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.bar .sp{flex:1}
.fl{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut)}
input[type=text],input[type=date],input[type=email],select,textarea,input[type=search]{border:1px solid #cbd5e1;border-radius:6px;padding:7px 9px;background:#fff;color:var(--tx);width:100%;font-weight:400}
textarea{min-height:70px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:#f1f5f9;color:#475569}
.bar input[type=search]{min-width:260px}

/* Pills */
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.p-cerrada{background:#dcfce7;color:var(--ok)}
.p-vencida{background:#fee2e2;color:var(--bad)}
.p-por_vencer,.p-abierta{background:var(--lt);color:var(--az)}
.p-sin_fecha,.p-sin_acciones{background:#e2e8f0;color:#475569}
.p-dup{background:#fef08a;color:#713f12}

/* Lista de análisis */
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;margin-bottom:10px}
.card-h{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.card-h .fo{font-weight:700;color:var(--az);min-width:110px}
.card-h .mid{flex:1;min-width:220px}
.card-h .mid .t{font-weight:500}
.meta{font-size:12px;color:var(--mut)}
.card-b{border-top:1px solid var(--bd);padding:14px;background:var(--bg)}
.card-b h4{margin:12px 0 4px;color:var(--az);font-size:13px}
.card-b h4:first-child{margin-top:0}
.foto{max-width:320px;max-height:240px;border:1px solid var(--bd);border-radius:6px}
.arow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--bd)}
.arow .a-t{flex:1;min-width:220px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:8px;padding:32px;text-align:center;color:var(--mut)}

/* Tablas */
.tw{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:8px}
table.t{border-collapse:collapse;width:100%;min-width:1000px;font-size:12px}
table.t th{background:var(--az);color:#fff;text-align:left;padding:8px;font-weight:600;white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
table.t tr:nth-child(even) td{background:#f1f5f9}

/* Formulario */
.sec{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:14px}
.sec h3{margin:0 0 12px;color:var(--az);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
.fld .row{display:flex;gap:6px}
.lockn{background:var(--lt);border:1px solid var(--ac);border-radius:6px;padding:8px 12px;margin-bottom:14px;color:var(--az)}
.pq{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.pq .n{background:var(--az);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;margin-top:4px}
.ablk{border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:10px;background:var(--bg)}
.ablk h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.evid{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;flex-wrap:wrap}

/* Gráficas */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-bottom:14px}
.chart{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px}
.chart h3{margin:0 0 2px;font-size:14px;color:var(--az)}
.chart .meta{margin-bottom:8px}
.cv{position:relative;height:300px}
.note{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px 16px;font-size:12px;color:var(--mut);margin-top:14px}
.foot{margin-top:14px;background:var(--bg);color:var(--mut);font-size:12px;text-align:center;padding:10px}
.hint{font-size:12px;color:var(--mut)}
#userbox{display:flex;gap:10px;align-items:center;font-size:12px;flex-wrap:wrap}
#userbox .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
#userbox .btn:hover{background:rgba(255,255,255,.15)}
.login{max-width:380px;margin:40px auto;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:24px}

let dlgResolve = null;
function showDlg(msg, title, withCancel){
  if (dlgResolve) { const r = dlgResolve; dlgResolve = null; r(false); }
  return new Promise(res => {
    dlgResolve = res;
    $("#dlg-t").textContent = title || "Aviso"; $("#dlg-m").textContent = msg;
    $("#dlg-no").style.display = withCancel ? "" : "none";
    $("#dlg").classList.add("on"); $("#dlg-ok").focus();
  });
}
function closeDlg(v){ $("#dlg").classList.remove("on"); const r = dlgResolve; dlgResolve = null; if (r) r(v); }
function notify(msg, title){ showDlg(msg, title, false); }
function confirmUI(msg){ return showDlg(msg, "Confirmar", true); }
document.addEventListener("click", e => { const b = e.target.closest("#dlg [data-d]"); if (b) closeDlg(b.dataset.d === "ok"); });
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (dlgResolve) closeDlg(false); else if ($("#ov").classList.contains("on")) closeOverlay(); });

/* ---------- Almacenamiento (Supabase) ---------- */
const COLS = "id,owner_id,owner_email,estado,cerrado_at,data";
function rowToAn(r){ return {...r.data, id:r.id, owner_id:r.owner_id, owner_email:r.owner_email, estado:r.estado, cerrado_at:r.cerrado_at}; }
function anToData(a){ const o = JSON.parse(JSON.stringify(a)); ["owner_id","owner_email","estado","cerrado_at","_new"].forEach(k => delete o[k]); return o; }
function putLocal(an){ const i = state.analyses.findIndex(x => x.id === an.id); if (i >= 0) state.analyses[i] = an; else state.analyses.unshift(an); }
function dbError(e){
  const m = (e && e.message) || String(e);
  if (e && e.code === "23505") return new Error("El folio ya existe. Presiona Generar para obtener el siguiente.");
  if (e && e.code === "PGRST116") return new Error("No tienes permiso para modificar este análisis (puede estar cerrado o ser de otra persona).");
  if (/row-level security/i.test(m)) return new Error("No tienes permiso para esta acción.");
  return new Error(m);
}
const Store = {
  async load(){
    const {data, error} = await sb.from("analyses").select(COLS).order("created_at", {ascending:false});
    if (error) throw dbError(error);
    return data.map(rowToAn);
  },
  async upsert(a, isNew){
    const payload = anToData(a);
    const q = isNew ? sb.from("analyses").insert({id:a.id, folio:a.folio, data:payload}) : sb.from("analyses").update({data:payload}).eq("id", a.id);
    const {data, error} = await q.select(COLS).single();
    if (error) throw dbError(error);
    putLocal(rowToAn(data)); return true;
  },
  async setEstado(id, estado){
    const {data, error} = await sb.from("analyses").update({estado}).eq("id", id).select(COLS).single();
    if (error) throw dbError(error);
    putLocal(rowToAn(data));

/* ---------- Lógica de acciones y estatus ---------- */
function statusOf(a){
  if (a.fecha_cierre) return "cerrada";
  if (!a.fecha_compromiso) return "sin_fecha";
  const d = dayN(a.fecha_compromiso) - dayN(today());
  if (d < 0) return "vencida";
  if (d <= 3) return "por_vencer";
  return "abierta";
}
/* Lista las acciones con contenido. onlyCP = solo correctiva y preventiva (reporte MEJ-F-13). */
function actsOf(an, onlyCP){
  const out = [], A = an.acciones || {};
  [["inmediata","Corrección inmediata"],["correctiva","Correctiva"],["preventiva","Preventiva"]].forEach(([k,l]) => {
    const x = A[k];
    if (x && (x.texto||"").trim() && (!onlyCP || k !== "inmediata")) out.push({...x, k, i:-1, tipo:l});
  });
  if (!onlyCP) (an.acciones_adicionales || []).forEach((x,i) => { if ((x.texto||"").trim()) out.push({...x, k:"adicional", i, tipo:"Adicional"}); });
  return out;
}
function globalStatus(an){
  const s = actsOf(an).map(statusOf);
  if (!s.length) return "sin_acciones";
  if (s.includes("vencida")) return "vencida";
  if (s.every(x => x === "cerrada")) return "cerrada";
  if (s.includes("por_vencer")) return "por_vencer";
  if (s.includes("abierta")) return "abierta";
  return "sin_fecha";
}
const pill = s => `<span class="pill p-${s}">${ST_LABEL[s]}</span>`;
function folioCounts(){ const m = {}; state.analyses.forEach(a => { if (a.folio) m[a.folio] = (m[a.folio]||0) + 1; }); return m; }
function nextFolio(dep){
  const code = (DEPTS[dep]||{}).code; if (!code) return "";
  const yy = String(new Date().getFullYear()).slice(2);
  const re = new RegExp("^" + code + "-" + yy + "-(\\d+)$");
  let max = 0;
  state.analyses.forEach(a => { const m = re.exec(a.folio || ""); if (m) max = Math.max(max, +m[1]); });
  return code + "-" + yy + "-" + String(max + 1).padStart(4, "0");
}

function readDataURL(file){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); }); }
function readImage(file, max){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas"); c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", .8));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

async function openEvidence(x){
  const wrap = document.createElement("div");
  wrap.style.cssText = "text-align:left;height:100%;display:flex;flex-direction:column;gap:12px";
  const c = (x.evidencia_comentario || "").trim(), name = x.evidencia_nombre;

  const close = {label:"Cerrar", fn:closeOverlay};
  if (!x.evidencia_archivo && !x.evidencia_ruta) return openOverlay("Evidencia (comentario)", wrap, [close]);
  try {
    let blob;
    if (x.evidencia_ruta) {
      const r = await sb.storage.from("evidencias").download(x.evidencia_ruta);
      if (r.error) throw r.error;
      blob = r.data;
    } else {
      const [h, b] = x.evidencia_archivo.split(","); const mime0 = /data:([^;]+)/.exec(h)[1];
      const bin = atob(b); const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      blob = new Blob([arr], {type:mime0});
    }
    const mime = blob.type || "application/octet-stream";
    if (ovUrl) URL.revokeObjectURL(ovUrl);
    ovUrl = URL.createObjectURL(blob);
    let node;
    if (mime.startsWith("image/")) { node = document.createElement("img"); node.src = ovUrl; node.alt = name || "Evidencia"; node.style.cssText = "max-width:100%;align-self:center"; }

    else { node = document.createElement("p"); node.textContent = "Este tipo de archivo no se puede previsualizar aquí. Usa Descargar para abrirlo en su programa."; node.style.margin = "0"; }
    wrap.appendChild(node);
    openOverlay(name || "Evidencia", wrap, [{label:"Descargar", href:ovUrl, download:name || "evidencia"}, {label:"Abrir en pestaña nueva", href:ovUrl}, close]);
  } catch(e) { notify("No se pudo abrir la evidencia: " + (e.message || e)); }
}

async function toggleClose(id, k, i){
  const a = state.analyses.find(x => x.id === id); if (!a) return;
  if (!puedeEditar(a)) return notify("No puedes modificar este análisis: ya está cerrado o lo capturó otra persona.");
  const t = k === "adicional" ? a.acciones_adicionales[i] : a.acciones[k];
  if (t.fecha_cierre) { t.fecha_cierre = ""; }
  else {
    if ((k === "correctiva" || k === "preventiva") && !hasEvid(t)) { notify("Para cerrar una acción correctiva o preventiva primero registra la evidencia: un archivo o un comentario (editar el análisis → Plan de acción)."); return; }
    t.fecha_cierre = today();
  }
  a.updated_at = Date.now();
  try { await Store.upsert(a, false); }
  catch(e) { notify("No se pudo guardar: " + e.message); try { state.analyses = await Store.load(); } catch(_) {} }
  render();
}

async function saveForm(){
  if (state.saving) return;
  const d = state.form;
  const faltan = [];
  if (d._new && !d.departamento) faltan.push("Departamento");
  if (d._new && !d.equipo_lean) faltan.push("Equipo Lean (si no hay equipo, elige N/A)");
  if (!d.linea_maquina) faltan.push("Línea / máquina");
  if (!(d.descripcion_falla || "").trim()) faltan.push("Descripción de la falla");
  if (faltan.length) return notify("Para guardar completa:\n• " + faltan.join("\n• "), "Falta información");
  for (const k of ["correctiva","preventiva"]) {
    const x = d.acciones[k];
    if (x.fecha_cierre && !hasEvid(x)) return notify("La acción " + k + " tiene fecha de cierre pero no tiene evidencia. Sube un archivo, escribe un comentario de evidencia o quita la fecha de cierre.");
  }
  state.saving = true;
  try {
    if (d._new) {
      if (!d.folio) d.folio = nextFolio(d.departamento);
      if (state.analyses.some(a => a.folio === d.folio)) { state.saving = false; return notify("El folio " + d.folio + " ya existe. Usa el botón Generar para obtener el siguiente."); }
      d.fecha_analisis = today();
    }
    const isNew = d._new, out = JSON.parse(JSON.stringify(d)); delete out._new; out.updated_at = Date.now();
    const ok = await Store.upsert(out, isNew);
    if (ok) {
      state.form = null; state.tab = "mis";
      toast(isNew ? "Análisis " + out.folio + " guardado correctamente" : "Cambios del análisis " + out.folio + " guardados correctamente");
      window.scrollTo(0, 0);
    }
  } catch(e) { notify("No se pudo guardar: " + e.message + "", "No se pudo guardar"); }
  state.saving = false; render();
}

function accRows(){
  const f = state.acc, rows = [];
  state.analyses.forEach(a => {
    if (f.dept && a.departamento !== f.dept) return;
    actsOf(a, true).forEach(x => {
      if (f.tipo && x.k !== f.tipo) return;
      rows.push({a, x, st:statusOf(x)});
    });
  });
  return rows;
}
const procSt = s => s === "abierta" || s === "por_vencer" ? "proceso" : s;
function viewAcc(){
  const base = accRows(), c = {vencida:0, proceso:0, cerrada:0, sin_fecha:0};

  const k = (key, l, cls) => `<button class="kpi ${cls} ${state.acc.card === key ? "sel" : ""}" data-act="acc-card" data-k="${key}"><div class="l">${l}</div><div class="v">${c[key]}</div></button>`;
  return `

    <div class="kpi ${pct === null ? "" : pct >= 80 ? "ok" : "bad"}"><div class="l">% sin retraso</div><div class="v">${pct === null ? "—" : pct + "%"}</div></div>
  </div>
  ${state.acc.card ? '<div class="hint" style="margin-bottom:8px">Filtrando por tarjeta. Vuelve a dar clic en ella para quitar el filtro.</div>' : ""}

function accTable(rows){

function pillSt(s, label){ const c = s === "proceso" ? "abierta" : s; return `<span class="pill p-${c}">${label}</span>`; }

/* ============================================================
   RESUMEN (Pareto de 4 niveles)
   ============================================================ */
function resBase(){
  const r = state.res;
  return state.analyses.filter(a => (!r.desde || (a.fecha_ocurrencia && a.fecha_ocurrencia >= r.desde)) && (!r.hasta || (a.fecha_ocurrencia && a.fecha_ocurrencia <= r.hasta)));
}
function tally(list, fn){
  const m = {};
  list.forEach(a => { const k = ((fn(a) || "").trim()) || "(sin dato)"; m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 12);
}
const PARETO = [
  {n:1, t:"Nivel 1 · Departamento con más fallas", fn:a => a.departamento},
  {n:2, t:"Nivel 2 · Tipo de falla (mecanismo / defecto)", fn:a => a.mecanismo_defecto},
  {n:3, t:"Nivel 3 · Máquina con más fallas", fn:a => a.linea_maquina},
  {n:4, t:"Nivel 4 · Coordinador / operador", fn:a => a.coordinador_operador}
];
function viewRes(){
  const r = state.res, d1 = resBase();
  const d2 = r.dept ? d1.filter(a => a.departamento === r.dept) : d1;
  const d3 = r.mec ? d2.filter(a => (a.mecanismo_defecto || "(sin dato)").trim() === r.mec) : d2;
  const all = d3.flatMap(a => actsOf(a).map(x => ({a, x, st:statusOf(x)})));
  const c = {abierta:0, por_vencer:0, vencida:0, cerrada:0, sin_fecha:0};
  all.forEach(y => c[y.st]++);
  const cerr = all.filter(y => y.st === "cerrada" && y.x.fecha_compromiso);
  const ontime = cerr.filter(y => y.x.fecha_cierre <= y.x.fecha_compromiso).length;
  const pct = cerr.length ? Math.round(ontime / cerr.length * 100) : null;
  const venc = all.filter(y => y.st === "vencida" || y.st === "por_vencer").sort((p, q) => p.x.fecha_compromiso.localeCompare(q.x.fecha_compromiso));
  const kp = (l, v, cls) => `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  return `
  <div class="bar">
    <div class="fl">Desde (fecha de ocurrencia)<input type="date" data-res="desde" value="${r.desde}"></div>
    <div class="fl">Hasta<input type="date" data-res="hasta" value="${r.hasta}"></div>
    <div class="fl">Departamento<select data-res="dept"><option value="">Todos</option>${Object.keys(DEPTS).map(d => `<option ${r.dept === d ? "selected" : ""}>${esc(d)}</option>`).join("")}</select></div>
    ${(r.desde || r.hasta || r.dept || r.mec) ? '<button class="btn" data-act="res-clear">Quitar filtros</button>' : ""}
  </div>
  ${(r.dept || r.mec) ? `<div class="hint" style="margin-bottom:8px">Filtros del Pareto: ${r.dept ? "<b>" + esc(r.dept) + "</b>" : ""}${r.dept && r.mec ? " › " : ""}${r.mec ? "<b>" + esc(r.mec) + "</b>" : ""}. Da clic otra vez en la misma barra para quitarlos.</div>` : '<div class="hint" style="margin-bottom:8px">Da clic en una barra del Nivel 1 (departamento) o del Nivel 2 (tipo de falla) para profundizar.</div>'}
  <div class="kpis">
    ${kp("Análisis totales", d3.length, "az")}${kp("Acciones abiertas", c.abierta, "az")}${kp("Por vencer", c.por_vencer, "az")}
    ${kp("Vencidas", c.vencida, c.vencida ? "bad" : "")}${kp("Cerradas", c.cerrada, "ok")}${kp("% cerradas a tiempo", pct === null ? "—" : pct + "%", pct === null ? "" : pct >= 80 ? "ok" : "bad")}
  </div>
  <div class="charts">
    ${PARETO.map(p => `<div class="chart"><h3>${p.t}</h3><div class="meta">Barras: número de análisis · Línea: % acumulado (referencia 80 %)</div><div class="cv"><canvas id="par${p.n}"></canvas></div></div>`).join("")}
  </div>
  <div class="charts"><div class="chart" style="grid-column:1/-1"><h3>Tipos de análisis</h3><div class="meta">Número de análisis por tipo</div><div class="cv" style="height:260px"><canvas id="tipos"></canvas></div></div></div>
  <div class="chart"><h3>Próximas a vencer y vencidas</h3><div class="meta">Todas las acciones con fecha compromiso a 3 días o menos, o ya vencida</div>
    ${venc.length ? `<div class="tw" style="border:0"><table class="t" style="min-width:760px"><thead><tr><th>Folio</th><th>Tipo</th><th>Acción</th><th>Responsable</th><th>Fecha compromiso</th><th>Status</th></tr></thead><tbody>${venc.map(y => `<tr><td>${esc(y.a.folio)}</td><td>${y.x.tipo}</td><td>${esc(y.x.texto)}</td><td>${esc(y.x.resp)}</td><td>${fmt(y.x.fecha_compromiso)}</td><td>${pill(y.st)}</td></tr>`).join("")}</tbody></table></div>` : '<div class="empty" style="border:0">No hay acciones vencidas ni por vencer.</div>'}</div>
  <div class="note"><b>Nota metodológica.</b> El filtro de fechas se aplica sobre la fecha de ocurrencia. El Nivel 1 respeta solo las fechas; el Nivel 2 también el departamento; los niveles 3 y 4 respetan departamento y tipo de falla. A diferencia del reporte Acciones, este resumen cuenta todas las acciones (corrección inmediata, correctiva, preventiva y adicionales). % cerradas a tiempo = cerradas con fecha de cierre igual o anterior a la fecha compromiso ÷ cerradas con fecha compromiso. Los Pareto muestran hasta 12 categorías.</div>
  <div class="foot">Generado: ${fmt(today())}</div>`;
}
function drawCharts(){
  charts.forEach(c => c.destroy()); charts = [];
  if (state.tab !== "res" || state.form || typeof Chart === "undefined") return;
  Chart.defaults.font.family = "Poppins, 'Segoe UI', sans-serif";
  const r = state.res, d1 = resBase();
  const d2 = r.dept ? d1.filter(a => a.departamento === r.dept) : d1;
  const d3 = r.mec ? d2.filter(a => (a.mecanismo_defecto || "(sin dato)").trim() === r.mec) : d2;
  const src = {1:d1, 2:d2, 3:d3, 4:d3};
  PARETO.forEach(p => {
    const cv = document.getElementById("par" + p.n); if (!cv) return;
    const rows = tally(src[p.n], p.fn), total = rows.reduce((s, x) => s + x[1], 0);
    let acc = 0; const cum = rows.map(x => { acc += x[1]; return Math.round(acc / total * 1000) / 10; });
    const labels = rows.map(x => x[0]);
    const sel = p.n === 1 ? r.dept : p.n === 2 ? r.mec : "";
    const colors = labels.map(l => {
      if (p.n === 1) return !sel || l === sel ? deptColor(l) : "#cbd5e1";
      if (p.n === 2) return !sel || l === sel ? "#0D18A8" : "#aab1ea";
      return "#0D18A8";
    });
    charts.push(new Chart(cv, {
      data:{labels, datasets:[
        {type:"bar", label:"Análisis", data:rows.map(x => x[1]), backgroundColor:colors, yAxisID:"y", order:2},
        {type:"line", label:"% acumulado", data:cum, borderColor:"#227EF6", backgroundColor:"#227EF6", pointRadius:3, tension:0, yAxisID:"y1", order:1},
        {type:"line", label:"80 %", data:labels.map(() => 80), borderColor:"#991b1b", borderDash:[6, 4], borderWidth:1.5, pointRadius:0, yAxisID:"y1", order:0}
      ]},
      options:{responsive:true, maintainAspectRatio:false,
        onClick:(e, els, ch) => {
          if (!els.length || p.n > 2) return;
          const l = ch.data.labels[els[0].index];
          if (p.n === 1) { state.res.dept = state.res.dept === l ? "" : l; state.res.mec = ""; }
          else state.res.mec = state.res.mec === l ? "" : l;
          render();
        },
        onHover:(e, els) => { e.native.target.style.cursor = els.length && p.n <= 2 ? "pointer" : "default"; },
        scales:{y:{beginAtZero:true, ticks:{precision:0}, title:{display:true, text:"Análisis"}},
          y1:{position:"right", min:0, max:100, grid:{drawOnChartArea:false}, ticks:{callback:v => v + "%"}},
          x:{ticks:{maxRotation:50, autoSkip:false}}},
        plugins:{legend:{position:"bottom"}}}
    }));
  });
  const cv = document.getElementById("tipos");
  if (cv) {
    const rows = tally(d3, a => a.tipo_analisis);
    charts.push(new Chart(cv, {type:"bar", data:{labels:rows.map(x => x[0]), datasets:[{label:"Análisis", data:rows.map(x => x[1]), backgroundColor:"#0D18A8"}]},
      options:{indexAxis:"y", responsive:true, maintainAspectRatio:false, scales:{x:{beginAtZero:true, ticks:{precision:0}, title:{display:true, text:"Análisis"}}}, plugins:{legend:{display:false}}}}));
  }
}

  <div class="hd"><div class="lg">${logoPrint}</div><div class="tt">Análisis de Causa Raíz · 5 Porqués</div><div class="cl">Clave: MEJ-F-02<br>Folio: <b>${esc(a.folio)}</b></div></div>
  <table><tr><td class="k">Departamento</td><td>${esc(a.departamento)}</td><td class="k">Equipo Lean</td><td>${esc(a.equipo_lean)}</td><td class="k">Tipo de análisis</td><td>${esc(a.tipo_analisis)}</td></tr>
  <tr><td class="k">Línea / máquina</td><td>${esc(a.linea_maquina)}</td><td class="k">Tipo de producto</td><td>${esc(a.tipo_producto)}</td><td class="k">Mecanismo / defecto</td><td>${esc(a.mecanismo_defecto)}</td></tr>
  <tr><td class="k">Turno</td><td>${esc(a.turno)}</td><td class="k">Coordinador / operador</td><td>${esc(a.coordinador_operador)}</td><td class="k">Ocurrencia</td><td>${esc(a.ocurrencia)}</td></tr>
  <tr><td class="k">Fecha de ocurrencia</td><td>${fmt(a.fecha_ocurrencia)}</td><td class="k">Fecha del análisis</td><td>${fmt(a.fecha_analisis)}</td><td class="k">Realizó el análisis</td><td>${esc(a.persona_analisis)}</td></tr></table>
  <h3>Descripción detallada de la falla</h3><div class="box">${nl(a.descripcion_falla)}</div>
  ${a.evidencia_foto ? `<h3>Fotografía del defecto</h3><div class="box"><img src="${a.evidencia_foto}"></div>` : ""}
  <h3>Los 5 porqués</h3><table>${(a.porques || []).map((p, i) => `<tr><td class="k" style="width:8%">¿Por qué ${i+1}?</td><td>${nl(p)}</td></tr>`).join("")}</table>
  <h3>Causa raíz</h3><div class="box">${nl(a.causa_raiz)}</div>
  <h3>Evidencia</h3><div class="box">${nl(a.evidencia)}</div>
  <h3>Plan de acción</h3>
  <table><tr><th>Tipo</th><th>Acción</th><th>Responsable</th><th>Fecha compromiso</th><th>Fecha de cierre</th><th>Status</th></tr>
  ${acts.map(x => `<tr><td>${x.tipo}</td><td>${nl(x.texto)}${(x.evidencia_comentario || "").trim() ? "<br><i>Evidencia: " + nl(x.evidencia_comentario.trim()) + "</i>" : ""}</td><td>${esc(x.resp)}</td><td>${fmt(x.fecha_compromiso)}</td><td>${fmt(x.fecha_cierre)}</td><td>${ST_LABEL[statusOf(x)]}</td></tr>`).join("") || '<tr><td colspan="6">Sin acciones</td></tr>'}</table>
  <div class="pie">Generado: ${fmt(today())}</div>`);
}
function printAcc(){
  const rows = state.acc.card ? accRows().filter(r => procSt(r.st) === state.acc.card) : accRows();
  const lbl = s => ({proceso:"En proceso", vencida:"Vencida", cerrada:"Cerrada", sin_fecha:"Sin fecha"})[procSt(s)];
  printWin("Reporte de acciones MEJ-F-13", `
  <div class="hd"><div class="lg">${logoPrint}</div><div class="tt">Reporte de acciones correctivas y preventivas</div><div class="cl">Clave: MEJ-F-13<br>Fecha: ${fmt(today())}</div></div>
  <table><tr><th>Nr.</th><th>Folio</th><th>Categoría</th><th>Tipo de acción</th><th>Oportunidad</th><th>Acción</th><th>Responsable</th><th>Fecha identificación</th><th>Fecha límite</th><th>Fecha de cierre</th><th>Status</th></tr>
  ${rows.map((r, i) => `<tr><td>${i+1}</td><td>${esc(r.a.folio)}</td><td>${esc(r.a.tipo_analisis)}</td><td>${r.x.tipo}</td><td>${esc(r.a.descripcion_falla)}</td><td>${esc(r.x.texto)}</td><td>${esc(r.x.resp)}</td><td>${fmt(r.a.fecha_analisis)}</td><td>${fmt(r.x.fecha_compromiso)}</td><td>${fmt(r.x.fecha_cierre)}</td><td>${lbl(r.st)}</td></tr>`).join("")}</table>`);
}
function xlsxSave(rows, sheet, name){
  if (typeof XLSX === "undefined") return notify("No se cargó la librería de Excel. Revisa la conexión a internet y recarga la página.");
  if (!rows.length) return notify("No hay datos para exportar.");
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = Object.keys(rows[0]).map(k => ({wch:Math.min(50, Math.max(12, k.length + 2))}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheet);
  XLSX.writeFile(wb, name + "_" + today().replace(/-/g, "") + ".xlsx");
}
function exportMis(){
  xlsxSave(filteredAnalyses().map(a => {
    const o = {"Folio":a.folio, "Estatus":ST_LABEL[globalStatus(a)], "Departamento":a.departamento, "Equipo Lean":a.equipo_lean, "Tipo de análisis":a.tipo_analisis,
      "Línea / máquina":a.linea_maquina, "Tipo de producto":a.tipo_producto, "Mecanismo / defecto":a.mecanismo_defecto, "Turno":a.turno,
      "Coordinador / operador":a.coordinador_operador, "Ocurrencia":a.ocurrencia, "Fecha de ocurrencia":fmt(a.fecha_ocurrencia), "Fecha del análisis":fmt(a.fecha_analisis),
      "Persona que analizó":a.persona_analisis, "Descripción de la falla":a.descripcion_falla};
    (a.porques || []).forEach((p, i) => o["Porqué " + (i+1)] = p);
    o["Causa raíz"] = a.causa_raiz; o["Acciones"] = actsOf(a).length;
    return o;
  }), "Análisis", "Analisis_5_Porques");
}
function exportAcc(){
  const lbl = s => ({proceso:"En proceso", vencida:"Vencida", cerrada:"Cerrada", sin_fecha:"Sin fecha"})[procSt(s)];
  const rows = state.acc.card ? accRows().filter(r => procSt(r.st) === state.acc.card) : accRows();
  xlsxSave(rows.map((r, i) => ({"Nr.":i+1, "Folio":r.a.folio, "Categoría":r.a.tipo_analisis, "Tipo de acción":r.x.tipo, "Oportunidad":r.a.descripcion_falla, "Acción":r.x.texto,
    "Responsable":r.x.resp, "Fecha identificación":fmt(r.a.fecha_analisis), "Fecha límite de implementación":fmt(r.x.fecha_compromiso), "Fecha de cierre de acción":fmt(r.x.fecha_cierre), "Status":lbl(r.st)})),
    "MEJ-F-13", "Reporte_Acciones_MEJ-F-13");
}

/* ============================================================
   DIRECTORIO (solo modo servidor)
   ============================================================ */
const dirInfo = {updated:null, error:""};
function viewDir(){
  return `
  <div class="bar">
    <div class="fl" style="flex:1;min-width:240px">Buscar
      <input type="search" id="dq" placeholder="Nombre, correo, puesto o departamento" value="${esc(state.dirQ || "")}"></div>
    <label class="btn pri" style="cursor:pointer">Cargar Excel<input type="file" id="dirfile" accept=".xlsx,.xls,.csv" hidden></label>
  </div>
  <div class="note" style="margin:0 0 12px">
    <b>Directorio de correos:</b> ${DIRECTORIO.length} contactos${dirInfo.updated ? " · última actualización: " + fmt(new Date(dirInfo.updated).toISOString().slice(0,10)) : ""}.
    Al elegir un responsable en el plan de acción, su correo se llena automáticamente.
    Para actualizarlo, carga un Excel con las columnas <b>Display name</b>, <b>User principal name</b>, <b>Title</b> y <b>Department</b> (el formato de la exportación de usuarios de Microsoft 365). También se aceptan los encabezados <b>Nombre</b>, <b>Correo</b>, <b>Puesto</b> y <b>Departamento</b>.
    La carga <b>reemplaza</b> todo el directorio actual.
  </div>
  <div id="dirlist"></div>`;
}
function renderDirList(){
  const L = $("#dirlist"); if (!L) return;
  const q = normN(state.dirQ || "");
  const rows = DIRECTORIO.filter(r => !q || r.some(c => normN(c).includes(q)));
  L.innerHTML = rows.length
    ? `<div class="tw"><table class="t" style="min-width:760px"><thead><tr><th>Nombre</th><th>Correo</th><th>Puesto</th><th>Departamento</th></tr></thead><tbody>${rows.slice(0, 300).map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3] || "")}</td></tr>`).join("")}</tbody></table></div>${rows.length > 300 ? `<div class="hint" style="margin-top:6px">Se muestran los primeros 300 de ${rows.length}. Usa el buscador para acotar.</div>` : ""}`
    : '<div class="empty">Ningún contacto coincide con la búsqueda.</div>';
}
async function loadDirectorioFile(file){
  if (typeof XLSX === "undefined") return notify("No se cargó la librería de Excel. Revisa la conexión a internet y recarga la página.");
  let raw;
  try { const wb = XLSX.read(await file.arrayBuffer(), {type:"array"}); raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""}); }
  catch(e) { return notify("No se pudo leer el archivo. Verifica que sea un Excel (.xlsx) o CSV."); }
  const pick = (o, names) => { for (const k of Object.keys(o)) if (names.includes(normN(k))) return String(o[k]).trim(); return ""; };
  const all = raw.map(o => [
    pick(o, ["DISPLAY NAME","NOMBRE","NAME"]),
    pick(o, ["USER PRINCIPAL NAME","CORREO","EMAIL","MAIL","CORREO ELECTRONICO"]).toLowerCase(),
    pick(o, ["TITLE","PUESTO"]),
    pick(o, ["DEPARTMENT","DEPARTAMENTO"])
  ]);
  const rows = all.filter(r => r[0] && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r[1]));
  if (!rows.length) return notify("No se encontraron contactos. El archivo debe tener columnas de nombre y correo (por ejemplo Display name y User principal name).");
  const skipped = all.length - rows.length;
  if (!(await confirmUI(`Se cargarán ${rows.length} contactos y reemplazarán los ${DIRECTORIO.length} actuales.${skipped ? "\n" + skipped + " filas sin nombre o sin correo válido se omitirán." : ""}\n\n¿Continuar?`))) return;
  try {
    const payload = rows.map(r => ({nombre:r[0], correo:r[1], puesto:r[2], departamento:r[3]}));
    const r = await sb.rpc("reemplazar_directorio", {p_rows:payload});
    if (r.error) throw r.error;
    setDirectorio(rows); render();
    notify("Directorio actualizado: " + r.data + " contactos.");
  } catch(e) { notify("No se pudo actualizar el directorio: " + (e.message || e)); }
}

/* ============================================================
   RENDER Y EVENTOS
   ============================================================ */
function render(){
  charts.forEach(c => c.destroy()); charts = [];
  const logged = !!state.user;
  $("#nav").hidden = !logged || state.user.mustChange; $("#tab-dir").hidden = !state.isAdmin;
  renderUserBox();
  if (!CONFIGURADO) { $("#app").innerHTML = viewSetup(); return; }
  if (state.loading) { $("#app").innerHTML = '<div class="empty">Cargando…</div>'; return; }
  if (!logged) { $("#app").innerHTML = viewLogin(); return; }
  if (state.user.mustChange) { $("#app").innerHTML = viewForzarPassword(); return; }
  if (state.tab === "dir" && !state.isAdmin) state.tab = "mis";
  document.querySelectorAll("nav .tab").forEach(b => b.classList.toggle("on", !state.form && b.dataset.t === state.tab));
  const app = $("#app");
  if (state.form) app.innerHTML = viewForm();
  else if (state.tab === "mis") { app.innerHTML = viewMis(); renderList(); }
  else if (state.tab === "dir") { app.innerHTML = viewDir(); renderDirList(); }
  else if (state.tab === "acc") app.innerHTML = viewAcc();
  else { app.innerHTML = viewRes(); drawCharts(); }
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === "toggle") { if (e.target.closest("button")) return; state.open[id] = !state.open[id]; renderList(); return; }
  if (act === "tab") { state.form = null; state.tab = t.dataset.t; render(); }
  else if (act === "new") openForm();
  else if (act === "edit") openForm(id);
  else if (act === "cancel") { if (await confirmUI("¿Salir sin guardar los cambios?")) { state.form = null; render(); } }
  else if (act === "save") saveForm();
  else if (act === "del") {
    if (!state.isAdmin) return notify("Solo la administradora puede eliminar análisis.");
    const a = state.analyses.find(x => x.id === id);
    if (await confirmUI("¿Eliminar el análisis " + a.folio + "? Esta acción no se puede deshacer.")) { try { await Store.remove(id); } catch(err) { notify("No se pudo eliminar: " + err.message); } render(); }
  }
  else if (act === "print") printAnalysis(id);
  else if (act === "close-an") {
    if (await confirmUI("¿Cerrar este análisis?\n\nUna vez cerrado ya no se podrá modificar. Solo la administradora puede reabrirlo.")) {
      try { await Store.setEstado(id, "cerrado"); toast("Análisis cerrado"); } catch(err) { notify(err.message); }
      render();
    }
  }
  else if (act === "reopen-an") {
    try { await Store.setEstado(id, "abierto"); toast("Análisis reabierto"); } catch(err) { notify(err.message); }
    render();
  }
  else if (act === "logout") cerrarSesion();
  else if (act === "chpw") cambiarPassword();
  else if (act === "backup") respaldo();
  else if (act === "close") toggleClose(id, t.dataset.k, +t.dataset.i);
  else if (act === "evid") {
    const a = state.analyses.find(x => x.id === id), k = t.dataset.k, i = +t.dataset.i;
    const x = k === "adicional" ? a.acciones_adicionales[i] : a.acciones[k]; if (hasEvid(x)) openEvidence(x);
  }
  else if (act === "export-mis") exportMis();
  else if (act === "export-acc") exportAcc();
  else if (act === "print-acc") printAcc();
  else if (act === "acc-card") { state.acc.card = state.acc.card === t.dataset.k ? "" : t.dataset.k; render(); }
  else if (act === "res-clear") { state.res = {desde:"", hasta:"", dept:"", mec:""}; render(); }
  else if (act === "gen-folio") {
    if (!state.form.departamento) return notify("Primero selecciona el departamento.");
    state.form.folio = nextFolio(state.form.departamento); render();
  }
  else if (act === "add-adic") { state.form.acciones_adicionales.push(emptyAction()); render(); }
  else if (act === "del-adic") { state.form.acciones_adicionales.splice(+t.dataset.i, 1); render(); }
  else if (act === "rm-foto") { state.form.evidencia_foto = ""; render(); }
  else if (act === "rm-evid") { const x = getP(state.form, t.dataset.p); x.evidencia_archivo = ""; x.evidencia_ruta = ""; x.evidencia_nombre = ""; render(); }
  else if (act === "form-evid") { const x = getP(state.form, t.dataset.p); if (x.evidencia_archivo || x.evidencia_ruta) openEvidence(x); }
});

document.addEventListener("submit", e => {
  if (e.target.id === "loginform") { e.preventDefault(); iniciarSesion($("#lg-mail").value, $("#lg-pass").value); }
  if (e.target.id === "pwform") { e.preventDefault(); guardarPasswordInicial(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { state.q = t.value; renderList(); return; }
  if (t.id === "dq") { state.dirQ = t.value; renderDirList(); return; }
  if (t.dataset.p && state.form) { setP(state.form, t.dataset.p, t.value); autoEmail(t.dataset.p, t.value); }
});

document.addEventListener("change", async e => {
  const t = e.target;
  if ("mine" in t.dataset) { state.onlyMine = t.checked; renderList(); return; }
  if (t.dataset.p && state.form) {
    setP(state.form, t.dataset.p, t.value); autoEmail(t.dataset.p, t.value);
    if (t.dataset.p === "departamento") { state.form.linea_maquina = ""; state.form.equipo_lean = (t.value && !(LEAN_TEAMS[t.value] || []).length) ? "N/A" : ""; if (state.form._new) state.form.folio = ""; }
    if (t.dataset.rr) render();
  }
  if (t.dataset.acc) { state.acc[t.dataset.acc] = t.value; state.acc.card = ""; render(); }
  if (t.dataset.res) {
    state.res[t.dataset.res] = t.value;
    if (t.dataset.res === "dept") state.res.mec = "";
    render();
  }
  if (t.id === "dirfile" && t.files[0]) { await loadDirectorioFile(t.files[0]); t.value = ""; return; }
  if (t.id === "foto" && t.files[0]) {
    try { state.form.evidencia_foto = await readImage(t.files[0], 900); render(); } catch(err) { notify("No se pudo leer la imagen."); }
  }
  if (t.dataset.evid && t.files[0]) {
    const f = t.files[0], x = getP(state.form, t.dataset.evid);
    try {
      let blob = f, nombre = f.name, tipo = f.type;
      if (f.type.startsWith("image/")) {
        const url = await readImage(f, 1200); blob = await (await fetch(url)).blob(); tipo = "image/jpeg"; nombre = f.name.replace(/\.[^.]+$/, "") + ".jpg";
      } else if (f.size > 4 * 1024 * 1024) { t.value = ""; return notify("El archivo pesa más de 4 MB. Elige uno más pequeño."); }
      const ruta = state.form.id + "/" + Date.now() + "-" + nombre.replace(/[^\w.\-]+/g, "_");
      const up = await sb.storage.from("evidencias").upload(ruta, blob, {contentType:tipo, upsert:false});
      if (up.error) throw up.error;
      x.evidencia_ruta = ruta; x.evidencia_archivo = ""; x.evidencia_nombre = nombre; render(); toast("Evidencia cargada");
    } catch(err) { notify("No se pudo subir la evidencia: " + (err.message || err)); }
  }
});

/* Al elegir un responsable del directorio, se llena su correo automáticamente */
function autoEmail(path, value){
  if (!state.form || !/\.resp$/.test(path)) return;
  const person = findPerson(value); if (!person) return;
  const base = path.replace(/\.resp$/, "");
  setP(state.form, path, person[0]);
  setP(state.form, base + ".resp_email", person[1]);
  const em = document.querySelector('[data-p="' + base + '.resp_email"]'); if (em) em.value = person[1];
  const rs = document.querySelector('[data-p="' + path + '"]'); if (rs && rs.value !== person[0]) rs.value = person[0];
}

/* ---------- Inicio ---------- */
(async function init(){
  if (!sb) { state.loading = false; render(); return; }
  sb.auth.onAuthStateChange(ev => {
    if (ev === "SIGNED_OUT" && state.user) { Object.assign(state, {user:null, isAdmin:false, analyses:[], form:null, open:{}, onlyMine:false, q:"", tab:"mis"}); render(); }
  });
  try { if (await cargarSesion() && !state.user.mustChange) await cargarDatos(); }
  catch(e) { notify("No se pudo conectar con Supabase: " + (e.message || e), "Sin conexión"); }
  state.loading = false; render();
})();
</script>
